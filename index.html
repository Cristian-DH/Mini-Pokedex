
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pokedex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container py-4">

    <h1 class="text-center mb-4 d-flex justify-content-center align-items-center gap-2">

        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg"
             style="width:32px;height:32px;">

        Mini Pokedex

        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg"
             style="width:32px;height:32px;">

    </h1>

    <!-- BUSCADOR -->
    <div class="d-flex justify-content-center gap-2 mb-3">
        <input id="searchInput" class="form-control w-50" placeholder="Buscar Pokémon...">
        <button id="searchBtn" class="btn btn-warning">Buscar</button>
        <button id="resetBtn" class="btn btn-secondary">Reset</button>
    </div>

    <!-- GENERACIONES -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
        <button class="btn btn-primary" onclick="cargarGeneracion(1)">Gen 1</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(2)">Gen 2</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(3)">Gen 3</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(4)">Gen 4</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(5)">Gen 5</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(6)">Gen 6</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(7)">Gen 7</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(8)">Gen 8</button>
        <button class="btn btn-primary" onclick="cargarGeneracion(9)">Gen 9</button>
    </div>

    <!-- PAGINACIÓN -->
    <div class="d-flex justify-content-center gap-2 mb-3">
        <button id="prevBtn" class="btn btn-light">⬅</button>
        <div id="pageNumbers" class="d-flex gap-1"></div>
        <button id="nextBtn" class="btn btn-light">➡</button>
    </div>

    <div id="pokedex" class="row row-cols-1 row-cols-md-3 g-4"></div>

</div>

<!-- AUDIO -->
<audio id="bgMusic" loop preload="auto"></audio>

<button id="musicBtn" class="btn btn-success position-fixed bottom-0 end-0 m-3">
    🎵 Música
</button>

<script src="app.js"></script>

</body>
</html>
